server.port=8080
spring.datasource.url=jdbc:h2:file:./data/cleanstreet;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads
# Demo accounts (password demo123). Set false in production.
app.seed-demo-users=true
# OTP: "wakit" = real WhatsApp OTP, "twilio" = Twilio Verify SMS, "dev" = fixed 123456 local demo
# Keep dev as the default so a fresh clone runs without paid-provider credentials.
app.otp.provider=${OTP_PROVIDER:dev}
app.otp.cooldown-seconds=30
app.otp.max-attempts=5
# Wakit credential: WAKIT_API_KEY (keep it in an environment variable, never commit it)
# Twilio credentials: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_VERIFY_SERVICE_SID
# SLA hours per priority
app.sla.low=72
app.sla.medium=48
app.sla.high=24
app.sla.critical=12
# Category|default priority
app.categories=Illegal dumping|MEDIUM,Overflowing garbage bin|MEDIUM,Roadside waste|LOW,Plastic waste|LOW,Construction waste|MEDIUM,Open garbage burning|HIGH,Sewage/wastewater issue|HIGH,Dead animal|HIGH,Blocked drainage|HIGH,Public toilet sanitation|MEDIUM,Other|LOW
# Security controls
app.security.session-hours=8
app.security.max-login-attempts=5
app.security.lock-minutes=15
