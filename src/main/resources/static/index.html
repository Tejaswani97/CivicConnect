/* ===== CivicConnect complaint dashboard upgrade ===== */
.work-dashboard { max-width:1040px; margin:12px auto 0; }
.work-header { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:22px; }
.work-header .sub { margin-bottom:0; }
.work-header-actions { display:flex; gap:8px; flex-shrink:0; }
.work-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:20px 0 24px; }
.work-stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; min-width:0; }
.work-stat-label { display:block; color:var(--muted); font-size:13px; margin-bottom:8px; }
.work-stat-value { display:block; font-size:27px; line-height:1.2; font-weight:700; }
.work-stat-note { display:block; color:var(--muted); font-size:12px; margin-top:6px; }
.work-filters { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:18px; }
.work-filter-grid { display:grid; grid-template-columns:minmax(180px,2fr) repeat(2,minmax(145px,1fr)); gap:12px; align-items:end; }
.work-filter-grid label { margin:0 0 6px; font-size:13px; }
.work-filter-grid input,.work-filter-grid select { min-width:0; width:100%; }

.work-overdue { display:inline-block; color:var(--bad); font-size:11px; font-weight:700; margin-top:6px; }
.work-empty { grid-column:1/-1; padding:34px 20px; text-align:center; border:1px dashed #b9c9c5; background:var(--card); color:var(--muted); border-radius:12px; }
.work-empty strong { display:block; color:var(--ink); font-size:16px; margin-bottom:6px; }
.work-reset { margin-top:12px; }
@media(max-width:700px) {
 .work-header {display:block}
 .work-header-actions {margin-top:12px}
 .work-stats {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .work-stat {padding:13px}
 .work-stat-value {font-size:24px}
 .work-filter-grid {grid-template-columns:1fr}
 .work-results-bar {align-items:flex-start}

let otpTimer=null,otpExpiresAt=0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=(Date.now()-new Date(t))/6e4;return m<1?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
async function api(p,o={}){const h={...(o.headers||{})};if(S.token)h.Authorization='Bearer '+S.token;if(o.json){h['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
 const r=await fetch('/api'+p,{...o,headers:h});const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&S.token)logout(true);throw new Error(d.error||'Something went wrong')}return d}

async function loadProtectedImages(root=document){
  const imgs=[...root.querySelectorAll('[data-media]')];
  await Promise.all(imgs.map(async img=>{
    const path=img.dataset.media;
    if(!path || !S.token) return;
    try{
      const r=await fetch(path,{headers:{Authorization:'Bearer '+S.token}});
      if(!r.ok) return;
      const blob=await r.blob();
      img.src=URL.createObjectURL(blob);
    }catch(e){}
  }));
}

 return `<div class="card item" onclick="${S.view==='feed'?`trackView('${esc(c.number)}')`:`open_(${Number(c.id)})`}">${image}<div class="b"><span class="pill ${esc(c.status)}">${esc(LBL[c.status]||c.status)}</span> <span class="meta">${esc(c.number)} · ${esc(c.category)}</span><div><span class="work-priority ${esc(priority)}">${esc(priority)} priority</span>${overdue?`<span class="work-overdue">⚠ OVERDUE</span>`:''}</div><p>${esc(c.description)}</p><div class="meta">${esc(c.officeName||'Office not assigned')} · ${ago(c.createdAt)}</div>${c.dueAt?`<div class="meta" style="margin-top:5px">Deadline: ${new Date(c.dueAt).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>`:''}</div></div>`;

function clearOtpTimer(){if(otpTimer){clearInterval(otpTimer);otpTimer=null}otpExpiresAt=0}
function passwordRules(pw){return {length:pw.length>=8,upper:/[A-Z]/.test(pw),lower:/[a-z]/.test(pw),digit:/\d/.test(pw),special:/[^A-Za-z0-9]/.test(pw)}}
function passwordMarkup(id,auto,showRules=false){return `<div class="password-wrap"><input id="${id}" type="password" autocomplete="${auto}" oninput="${showRules?'updatePasswordRules()':''}"><button type="button" class="password-toggle" aria-label="Show password" onclick="togglePassword('${id}',this)">👁</button></div>${showRules?`<ul class="password-rules" id="passwordRules"><li data-rule="length">At least 8 characters</li><li data-rule="upper">1 uppercase letter</li><li data-rule="lower">1 lowercase letter</li><li data-rule="digit">1 digit</li><li data-rule="special">1 special character</li></ul>`:''}`}
function togglePassword(id,b){const i=$('#'+id);const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'🙈':'👁';b.setAttribute('aria-label',show?'Hide password':'Show password')}
function updatePasswordRules(){const r=passwordRules($('#pw')?.value||'');document.querySelectorAll('#passwordRules [data-rule]').forEach(e=>e.classList.toggle('ok',!!r[e.dataset.rule]))}
function startOtpTimer(){clearOtpTimer();otpExpiresAt=Date.now()+5*60*1000;const tick=()=>{const left=Math.max(0,otpExpiresAt-Date.now());const sec=Math.ceil(left/1000);const m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');const t=$('#otpTimer'),v=$('#verifyBtn'),rb=$('#resendBtn');if(t)t.textContent=left?`Code expires in ${m}:${s}`:'Code expired. Request a new one.';if(v)v.disabled=!left;if(rb)rb.disabled=!!left;if(!left){clearOtpTimer()} };tick();otpTimer=setInterval(tick,250)}
function login(){const r=S.tab=='register',v=S.tab=='otp';if(!v)clearOtpTimer();
 $('#app').innerHTML=`<div class="card panel">${v?'':`<div class="tabs"><button class="${!r?'on':''}" onclick="S.tab='login';login()">Log in</button><button class="${r?'on':''}" onclick="S.tab='register';login()">Create account</button></div>`}
 ${v?`<h2>Verify your mobile number</h2><p class="sub">Enter the 6-digit verification code sent to +91 XXXXXX${esc(String(S.phone).slice(-4))}.</p><label>OTP</label><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div id="otpTimer" class="meta" style="margin-top:8px;font-weight:600">Code expires in 5:00</div><div id="m"></div><button id="verifyBtn" class="btn block" onclick="verify()">Verify and continue</button><button id="resendBtn" class="btn alt block" disabled onclick="resend()">Resend OTP</button>`
 :`${r?'<label>Full name</label><input id="nm" autocomplete="name">':''}<label>Mobile number</label><input id="ph" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel"><label>Password</label>${passwordMarkup('pw',r?'new-password':'current-password',r)}<div id="m"></div><button class="btn block" onclick="${r?'register()':'doLogin()'}">${r?'Send OTP':'Log in'}</button><p class="meta" style="margin-top:14px">Municipal officers and cleaning staff log in here with the credentials given by their office.</p>`}</div>`;
 if(v)startOtpTimer(); else if(r)updatePasswordRules();}

async function register(){const pw=$('#pw').value;const r=passwordRules(pw);if(!Object.values(r).every(Boolean))return msg('m','Password must be 8+ characters with uppercase, lowercase, number and special character');if($('#nm').value.trim().length<2)return msg('m','Enter your full name');try{const d=await api('/auth/register',{method:'POST',json:{name:$('#nm').value,phone:$('#ph').value,password:pw}});S.phone=$('#ph').value;S.tab='otp';login();msg('m',d.message,1)}catch(e){msg('m',e.message)}}
async function resend(){try{const d=await api('/auth/resend',{method:'POST',json:{phone:S.phone}});startOtpTimer();msg('m',d.message,1)}catch(e){msg('m',e.message)}}
function start(d){S.token=d.token;S.user=d.user;localStorage.tok=d.token;localStorage.usr=JSON.stringify(d.user);S.tab='login';go(d.user.role=='CITIZEN'?'dashboard':'mine')}
async function verify(){if(Date.now()>=otpExpiresAt)return msg('m','This code has expired. Request a new OTP.');if(!/^\d{6}$/.test($('#otp').value))return msg('m','Enter the 6-digit OTP');try{start(await api('/auth/verify',{method:'POST',json:{phone:S.phone,otp:$('#otp').value}}))}catch(e){msg('m',e.message)}}
async function doLogin(){try{start(await api('/auth/login',{method:'POST',json:{phone:$('#ph').value,password:$('#pw').value}}))}catch(e){msg('m',e.message);if(/Verify/.test(e.message)){S.phone=$('#ph').value}}}

/* ===== Admin overview and audit trail ===== */
function adminDate(value){
 if(!value)return '—';const d=new Date(value);return Number.isFinite(d.getTime())?d.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):String(value);
}
function adminRows(payload){
 if(Array.isArray(payload))return payload;
 if(payload&&typeof payload==='object'){
  for(const k of ['events','auditEvents','content','items','data','logs'])if(Array.isArray(payload[k]))return payload[k];
 }
 return [];
}
function adminAuditRow(a){
 const actor=a.actorName||a.userName||a.username||a.byName||a.actor||a.user||'System';
 const role=a.actorRole||a.userRole||a.byRole||a.role||'';
 const action=a.action||a.eventType||a.type||a.event||'Activity';
 const target=a.entityType||a.targetType||a.entity||a.resource||'';
 const targetId=a.entityId??a.targetId??a.resourceId;
 const detail=a.details||a.description||a.message||a.note||'';
 const time=a.createdAt||a.timestamp||a.occurredAt||a.time||a.eventTime;
 return `<tr><td>${esc(adminDate(time))}</td><td><b>${esc(actor)}</b>${role?`<div class="meta">${esc(String(role).toLowerCase())}</div>`:''}</td><td>${esc(action)}</td><td>${esc(target?String(target)+(targetId!=null?' #'+targetId:''):'—')}</td><td>${esc(detail||'—')}</td></tr>`;
}

/* ===== Complaint dashboard data and filters ===== */
let MINE_DATA = [];
const MINE_ACTIVE_STATUSES = ['REPORTED','VERIFIED','ASSIGNED','ACCEPTED','IN_PROGRESS','REOPENED'];
const MINE_CLOSED_STATUSES = ['COMPLETED','RESOLVED','REJECTED'];
function mineIsOverdue(c) {
 if (!c.dueAt) return false;
 if (MINE_CLOSED_STATUSES.includes(c.status)) return false;
 const deadline = new Date(c.dueAt).getTime();
 return Number.isFinite(deadline) && deadline < Date.now();
}
function minePriority(c) { return String(c.priority || 'MEDIUM').toUpperCase(); }
function mineUpdateStats(list) {
 const total=list.length;
 const active=list.filter(c=>MINE_ACTIVE_STATUSES.includes(c.status)).length;
 const closed=list.filter(c=>['COMPLETED','RESOLVED'].includes(c.status)).length;
 const overdue=list.filter(mineIsOverdue).length;
 $('#mineTotal').textContent=total;
 $('#mineActive').textContent=active;
 $('#mineClosed').textContent=closed;
 $('#mineOverdue').textContent=overdue;
}
function mineRenderList() {
 const search=($('#mineSearch').value||'').trim().toLowerCase();
 const status=$('#mineStatus').value;
 const priority=$('#minePriority').value;
 const filtered=MINE_DATA.filter(c=>{
  const searchable=[c.number,c.category,c.description,c.officeName].join(' ').toLowerCase();
  return (!search||searchable.includes(search)) &&
   (status==='ALL'||c.status===status) &&
   (priority==='ALL'||minePriority(c)===priority);
 });
 const results=$('#mineResults'), list=$('#list');
 results.textContent=`${filtered.length} of ${MINE_DATA.length} complaint`+(MINE_DATA.length===1?'':'s');
 if(!filtered.length) {
  const hasFilters=search||status!=='ALL'||priority!=='ALL';
  list.innerHTML=`<div class="work-empty"><strong>${hasFilters?'No matching complaints':'No complaints yet'}</strong><div>${hasFilters?'Try changing your search or filters.':S.user.role==='CITIZEN'?'Report your first civic issue to get started.':'There are no complaints assigned to this view yet.'}</div>${hasFilters?`<button class="btn alt work-reset" onclick="mineResetFilters()">Clear filters</button>`:S.user.role==='CITIZEN'?`<button class="btn work-reset" onclick="go('report')">+ Report issue</button>`:''}</div>`;
  return;
 }
 list.innerHTML=filtered.map(card).join('');
 loadProtectedImages(list);
}

 $('#mineStatus').value='ALL';

}

div><label for="minePriority">Filter by priority</label><select id="minePriority" onchange="mineRenderList()"><option value="ALL">All priorities</option><option value="CRITICAL">Critical</option><option value="HIGH">High</option><option value="MEDIUM">Medium</option><option value="LOW">Low</option></select></div></div></div><div class="work-results-bar"><h2>Complaints</h2><span id="mineResults" class="work-results-count">Loading…</span></div><div class="grid" id="list"><div class="work-empty"><strong>Loading complaints…</strong>Please wait while we fetch the latest data.</div></div></div>`;

}
async function open_(id){const {complaint:c,timeline:t}=await api('/complaints/'+id),u=S.user;let act='';
